name: praxiswerk

# PraxisWerk (ReWaDo) - Akte & Abrechnung in einer App.
# Start:         docker compose up --build
# Stoppen:       Strg+C  (bzw. docker compose down)
# Alles loeschen (inkl. Datenbank):  docker compose down -v
#
# Beim ersten Start wird eine LEERE Datenbank angelegt (schema.sql) und der
# Leistungskatalog (79 Eintraege) automatisch geseedet.
# Danach im Browser die Ersteinrichtung durchlaufen (Admin + Praxisdaten).
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # Fuer den Produktivbetrieb unbedingt ein eigenes Passwort waehlen!
      MYSQL_ROOT_PASSWORD: praxiswerk
      MYSQL_DATABASE: praxiswerk
    volumes:
      - db-daten:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      # Tipp: Eigene Datensicherung statt leerem Schema importieren?
      # Datei als dump.sql ablegen und stattdessen diese Zeile nutzen:
      # - ./dump.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppraxiswerk"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Maschinelle Übersetzung für mehrsprachige Anamnesebögen (nur intern,
  # kein Port nach außen — Patientendaten verlassen den Server nicht).
  translate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    environment:
      # Modelle nur für diese Sprachen laden (spart RAM/Download-Zeit)
      LT_LOAD_ONLY: de,en,tr,ar,ru,uk,sk
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/languages')"]
      interval: 15s
      timeout: 10s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      translate:
        condition: service_started
    environment:
      DATABASE_URL: mysql://root:praxiswerk@db:3306/praxiswerk
      # Geheimnis fuer Login-Sessions - unbedingt zufaellig setzen!
      APP_SECRET: bitte-zufaellig-setzen
      PORT: "3000"
      UPLOAD_DIR: /app/dokumente
      # GEFAHR: Login ueberspringen - nur fuer lokale Tests, niemals oeffentlich!
      # LOCAL_AUTH_BYPASS: "1"
    volumes:
      # Patienten-Dokumente (Uploads) persistent — Backup mitnehmen!
      - dokumente:/app/dokumente
    ports:
      - "3100:3000"

volumes:
  db-daten:
  dokumente:
