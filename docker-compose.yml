name: praxiswerk

# Dr.PaWaWi — Akte & Abrechnung in einer App.
#
# WICHTIG (Secrets): Diese Datei enthält bewusst KEINE Werte für Passwörter
# oder Geheimnisse. Alle Werte stehen nur in der .env — Docker Compose liest
# sie automatisch ein (Listen-Syntax: "- SCHLUESSEL" ohne Wert).
# Ersteinrichtung:  cp .env.example .env   und die Werte dort setzen.
#
# Start:                 docker compose up -d --build
# Stoppen:               docker compose down
# Alles loeschen (inkl. Datenbank):  docker compose down -v
#
# Beim ersten Start wird eine LEERE Datenbank angelegt (schema.sql) und der
# Leistungskatalog automatisch geseedet. Danach im Browser die
# Ersteinrichtung durchlaufen (Admin + Praxisdaten).
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD        # Wert kommt aus .env (Pflicht)
      - MYSQL_DATABASE=praxiswerk
    volumes:
      - db-daten:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      # Tipp: Eigene Datensicherung statt leerem Schema importieren?
      # Datei als dump.sql ablegen und stattdessen diese Zeile nutzen:
      # - ./dump.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      # $$ = literales $ im Container; die Shell dort loest die Variable auf
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Maschinelle Übersetzung für mehrsprachige Anamnesebögen (nur intern,
  # kein Port nach außen — Patientendaten verlassen den Server nicht).
  translate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    environment:
      - LT_LOAD_ONLY=de,en,tr,ar,ru,uk,sk
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/languages')"]
      interval: 15s
      timeout: 10s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      translate:
        condition: service_started
    environment:
      - DATABASE_URL               # Wert kommt aus .env (Pflicht)
      - APP_SECRET                 # Wert kommt aus .env (Pflicht)
      - PORT=3000
      - UPLOAD_DIR=/app/dokumente
      - TRANSLATE_URL=http://translate:5000
      # GEFAHR: Login ueberspringen - nur fuer lokale Tests, niemals oeffentlich!
      # - LOCAL_AUTH_BYPASS=1
    volumes:
      # Patienten-Dokumente (Uploads) persistent — Backup mitnehmen!
      - dokumente:/app/dokumente
    ports:
      - "3100:3000"

volumes:
  db-daten:
  dokumente:
